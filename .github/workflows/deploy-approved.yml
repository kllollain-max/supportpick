name: Deploy approved SupportPick snapshot
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact 40-character commit approved by the owner
        required: true
      approval:
        description: Type DEPLOY_SUPPORTPICK after owner approval
        required: true
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: supportpick-pages-operations
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.approval == 'DEPLOY_SUPPORTPICK'
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      APPROVED_SHA: ${{ inputs.approved_sha }}
    steps:
      - name: Validate SHA format
        run: '[[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - name: Check approved checkout
        run: 'test "$(git rev-parse HEAD)" = "$APPROVED_SHA"'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject stale source before building
        run: python tools/check_approved_head.py --approved-sha "$APPROVED_SHA"
      - name: Restore latest validated data before a code-only deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/restore_latest_state.py
      - run: python tools/build.py --output dist --public-base https://kllollain-max.github.io/supportpick/
      - run: python tools/verify_release.py --output dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Protect newer main changes before publication
        run: python tools/check_approved_head.py --approved-sha "$APPROVED_SHA"
      - uses: actions/deploy-pages@v4
      - name: Verify the public HTML release and restored data generation
        run: python tools/verify_release.py --output dist --live --expect-sha "$APPROVED_SHA" --expect-generation "$(python -c 'import json;print(json.load(open("dist/data.json"))["generation"])')" --report public-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supportpick-public-verification
          path: public-verification.json
          retention-days: 7
