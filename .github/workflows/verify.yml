name: Verify SupportPick release
on:
  pull_request:
  workflow_dispatch:
    inputs:
      backup_probe:
        description: Upload validated operational backup and rebuild from R2 in isolation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/*.test.cjs
      - run: python tools/build.py --output dist --public-base https://kllollain-max.github.io/supportpick/
      - run: python tools/verify_release.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: supportpick-verified-release
          path: dist/
          include-hidden-files: true
          retention-days: 3

  backup-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.backup_probe
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.37,<2'
      - name: Restore validated operational artifacts without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/restore_latest_state.py
          python tools/retrieve_evidence.py
          python tools/refresh.py --state collection-state --bundle-output runtime-state
      - name: R2 upload, read-back, isolated restore and full rebuild
        env:
          SUPPORTPICK_R2_ACCESS_KEY_ID: ${{ secrets.SUPPORTPICK_R2_ACCESS_KEY_ID }}
          SUPPORTPICK_R2_SECRET_ACCESS_KEY: ${{ secrets.SUPPORTPICK_R2_SECRET_ACCESS_KEY }}
          SUPPORTPICK_R2_ENDPOINT: ${{ secrets.SUPPORTPICK_R2_ENDPOINT }}
          SUPPORTPICK_R2_BUCKET: ${{ secrets.SUPPORTPICK_R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python tools/r2_backup.py backup --output output/r2-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supportpick-r2-probe
          path: output/r2-probe.json
          retention-days: 90
