name: Offline backup restore drill (manual, no deployment)
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful SupportPick operations run ID containing supportpick-runtime-state'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  isolated-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the existing validated GitHub backup (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]{8,20}$ ]] || { echo 'Invalid run ID'; exit 1; }
          mkdir -p offline-input
          gh run download "$SOURCE_RUN_ID" -R "$GITHUB_REPOSITORY" -n supportpick-runtime-state -D offline-input
      - name: Validate restored state and build offline
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from refresh import read_current, verify_snapshot
          state = Path('offline-input')
          current, snapshot = read_current(state)
          if not current or not snapshot:
              raise ValueError('backup_pointer_missing')
          generations = sorted((state / 'snapshots').iterdir())
          if not generations or any(not p.is_dir() or p.is_symlink() for p in generations):
              raise ValueError('invalid_snapshot_set')
          for path in generations:
              verify_snapshot(path)
          print(json.dumps({'restoredGeneration':current['generation'],
                            'restoredItems':current['count'],
                            'verifiedGenerations':len(generations)}))
          PY
          python tools/build.py --state offline-input --output dist --public-base https://kllollain-max.github.io/supportpick/
          python tools/verify_release.py --output dist
      - name: Report isolated restoration result
        if: always()
        run: |
          echo '## Offline backup restore drill' >> "$GITHUB_STEP_SUMMARY"
          echo 'No deployment, no publication, no repository write, no external backup modification.' >> "$GITHUB_STEP_SUMMARY"
