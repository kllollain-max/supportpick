name: Content mobile readability check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/build.py --output dist --public-base https://kllollain-max.github.io/supportpick/
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/naver_analytics_browser.cjs
      - run: node .github/scripts/check-content-mobile.cjs supportpick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-mobile-evidence
          path: mobile-evidence/
          retention-days: 7
