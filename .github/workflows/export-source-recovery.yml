name: Export source for independent recovery (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked source only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery-export"
          git archive --format=zip --output="$RUNNER_TEMP/recovery-export/supportpick-source.zip" HEAD
          unzip -t "$RUNNER_TEMP/recovery-export/supportpick-source.zip" | tail -n 1
          sha256sum "$RUNNER_TEMP/recovery-export/supportpick-source.zip" > "$RUNNER_TEMP/recovery-export/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: supportpick-source-recovery
          path: ${{ runner.temp }}/recovery-export/
          retention-days: 3
          if-no-files-found: error
