name: SupportPick full-data operations (approval gated)
on:
  workflow_dispatch:
  schedule:
    - cron: '20 9,21 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: supportpick-pages-operations
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.SUPPORTPICK_SITE_COLLECTION_APPROVED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore latest validated state or source baseline
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/restore_latest_state.py
      - name: Run completeness and data-preservation checks
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Collect and promote only a complete generation
        id: collect
        continue-on-error: true
        env:
          SUPPORTPICK_GOV24_SERVICE_KEY: ${{ secrets.SUPPORTPICK_GOV24_SERVICE_KEY }}
        run: python tools/refresh.py --state collection-state --output output/current-run --generation gov24-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build current data with accurate delay or failure status
        id: build
        run: python tools/build.py --state collection-state --output dist --public-base https://kllollain-max.github.io/supportpick/
      - name: Verify all static documents and advertised sitemap URLs
        run: python tools/verify_release.py --output dist
      - name: Preserve current and previous validated generations
        id: bundle
        if: always() && steps.restore.outcome == 'success' && steps.build.outcome == 'success'
        run: python tools/refresh.py --state collection-state --bundle-output runtime-state
      - uses: actions/upload-artifact@v4
        if: always() && steps.bundle.outcome == 'success'
        with:
          name: supportpick-runtime-state
          path: runtime-state/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supportpick-collection-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/current-run/
          retention-days: 14
      - name: Decide whether public content actually changed
        id: publish
        if: vars.SUPPORTPICK_SITE_PUBLIC_UPDATE_APPROVED == '1'
        run: python tools/release_policy.py --output dist --report output/publish-decision.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.publish.outcome == 'success'
        with:
          name: supportpick-publish-decision
          path: output/publish-decision.json
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: vars.SUPPORTPICK_SITE_PUBLIC_UPDATE_APPROVED == '1' && steps.publish.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.SUPPORTPICK_SITE_PUBLIC_UPDATE_APPROVED == '1' && steps.publish.outputs.publish == 'true'
        with:
          path: dist
      - name: Preserve newer blog or code changes before publication
        if: vars.SUPPORTPICK_SITE_PUBLIC_UPDATE_APPROVED == '1' && steps.publish.outputs.publish == 'true'
        run: python tools/check_approved_head.py --approved-sha "$(git rev-parse HEAD)"
      - uses: actions/deploy-pages@v4
        if: vars.SUPPORTPICK_SITE_PUBLIC_UPDATE_APPROVED == '1' && steps.publish.outputs.publish == 'true'
      - name: Verify deployed source, generation and every public HTML URL
        if: vars.SUPPORTPICK_SITE_PUBLIC_UPDATE_APPROVED == '1' && steps.publish.outputs.publish == 'true'
        run: python tools/verify_release.py --output dist --live --expect-sha "$(git rev-parse HEAD)" --expect-generation "$(python -c 'import json;print(json.load(open("dist/data.json"))["generation"])')" --report output/public-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supportpick-public-verification
          path: output/public-verification.json
          retention-days: 7
      - name: Report collection failure after retaining last good data and status
        if: steps.collect.outcome == 'failure'
        run: exit 1
