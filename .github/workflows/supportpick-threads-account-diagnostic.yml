name: SupportPick Threads Account Diagnostic

on:
  workflow_dispatch:

# This manual diagnostic only reads the existing Threads connection. It cannot
# reserve a publication or change repository state.
permissions:
  contents: read

concurrency:
  group: supportpick-threads-publisher
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify read-only diagnostic safety
        run: python -m unittest discover -s tests -p 'test_supportpick_account_diagnostic.py' -v
      - name: Diagnose existing Threads account without publishing
        env:
          SUPPORTPICK_THREADS_ACCESS_TOKEN: ${{ secrets.SUPPORTPICK_THREADS_ACCESS_TOKEN }}
          SUPPORTPICK_THREADS_USER_ID: ${{ secrets.SUPPORTPICK_THREADS_USER_ID }}
        run: python tools/supportpick_threads_account_diagnostic.py
      - name: Preserve sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supportpick-threads-account-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: threads-account-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
