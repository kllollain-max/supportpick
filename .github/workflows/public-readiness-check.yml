name: Read-only public readiness checks
on:
  schedule:
    - cron: '35 22 * * *'
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Optional exact commit already deployed for a read-only full check
        required: false
        type: string
      deployed_run_id:
        description: Successful publication run containing the original github-pages artifact
        required: false
        type: string
  workflow_run:
    workflows: [Deploy approved SupportPick snapshot, SupportPick full-data operations (approval gated)]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: supportpick-public-readiness-audit
  cancel-in-progress: false
jobs:
  verify-deployed:
    if: github.event_name == 'workflow_dispatch' && inputs.deployed_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      DEPLOYED_RUN_ID: ${{ inputs.deployed_run_id }}
    steps:
      - name: Validate deployed SHA
        run: '[[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          path: verifier
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source and successful publication step
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python verifier/tools/restore_pages_artifact.py --expected-sha "$DEPLOYED_SHA" --run-id "$DEPLOYED_RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.deployed_run_id }}
          github-token: ${{ github.token }}
          path: deployed-artifact
      - name: Restore and hash-check the original published bytes
        run: python verifier/tools/restore_pages_artifact.py --expected-sha "$DEPLOYED_SHA" --archive deployed-artifact/artifact.tar --output expected-dist
      - name: Check actual public files with paced requests
        run: python verifier/tools/verify_release.py --output expected-dist --live --expect-sha "$DEPLOYED_SHA" --report public-verification-recheck.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supportpick-public-verification-recheck
          path: public-verification-recheck.json
          retention-days: 14
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_public_readiness.py --project supportpick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supportpick-public-readiness
          path: public-readiness-report.json
          retention-days: 14
