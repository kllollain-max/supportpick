name: Read-only public readiness checks
on:
  schedule:
    - cron: '35 22 * * *'
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Optional exact commit already deployed for a read-only full check
        required: false
        type: string
  workflow_run:
    workflows: [Deploy approved SupportPick snapshot, SupportPick full-data operations (approval gated)]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: supportpick-public-readiness-audit
  cancel-in-progress: false
jobs:
  verify-deployed:
    if: github.event_name == 'workflow_dispatch' && inputs.deployed_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
    steps:
      - name: Validate deployed SHA
        run: '[[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          path: verifier
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: approved-site
          ref: ${{ inputs.deployed_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore validated runtime for the already deployed source
        working-directory: approved-site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/restore_latest_state.py
      - name: Rebuild expected files without publishing
        working-directory: approved-site
        run: python tools/build.py --output dist --public-base https://kllollain-max.github.io/supportpick/
      - name: Check actual public files with paced requests
        working-directory: approved-site
        run: python ../verifier/tools/verify_release.py --output dist --live --expect-sha "$DEPLOYED_SHA" --report ../public-verification-recheck.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supportpick-public-verification-recheck
          path: public-verification-recheck.json
          retention-days: 14
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_public_readiness.py --project supportpick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supportpick-public-readiness
          path: public-readiness-report.json
          retention-days: 14
